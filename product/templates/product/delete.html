{% extends 'base.html' %}
{% block content %}
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="card shadow-lg p-5 text-center border-0 rounded-4">
            <form method="post">
                {% csrf_token %}
                <h4 class="text-danger fw-bold mb-4">Are You Sure Delete {{ object }}?!</h4>
                <button type="submit" class="btn btn-danger px-4 py-2 rounded-pill">Delete</button>
                <a href="{% url 'product:product-list' %}" class="btn btn-secondary px-4 py-2 rounded-pill">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
