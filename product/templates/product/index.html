{% extends 'base.html' %}
{% block content %}
    {% load static %}
    <div class="container my-5">
        <div class="row justify-content-center">
            {% for pro in products %}
                <div class="col-md-4 mb-4">
                    <div class="card product-card border-0 shadow-lg rounded-lg overflow-hidden">
                        <a href="{% url 'product:product-detail' pro.pk %}" class="text-decoration-none">
                            {% if pro.image_display_url %}
                                <img src="{{ pro.image_display_url }}" class="card-img-top img-fluid"
                                     style="height: 260px; object-fit: cover;">
                            {% else %}
                                <img src="{% static 'default.png' %}" class="card-img-top img-fluid"
                                     style="height: 260px; object-fit: cover;">
                            {% endif %}


                        </a>
                        <div class="card-body text-center">
                            <h5 class="card-title text-dark font-weight-bold">{{ pro.name }}</h5>
                            <hr class="mx-auto" style="width: 50px; border-top: 2px solid #ff4757;">
                            <a href="{% url 'product:product-detail' pro.pk %}"
                               class="btn btn-danger btn-sm px-4 py-2 rounded-pill shadow-sm">View product</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <style>
        .product-card {
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.15);
        }

        .btn-danger {
            background-color: #ff4757;
            border: none;
        }

        .btn-danger:hover {
            background-color: #e84118;
        }
    </style>
{% endblock %}
