{% extends 'base.html' %}

{% block content %}
<div class="container">
    <!-- تصویر پروفایل -->
    <div class="text-center mb-4">
        <img src="{{ profile.image }}" style="border-radius: 50%; height: 180px; width: 180px; object-fit: cover;">
    </div>

    <!-- فرم ویرایش پروفایل -->
    <div class="d-flex justify-content-center">
        <form method="post" style="max-width: 500px; width: 100%;">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary btn-block" type="submit">Edit Profile</button>
        </form>
    </div>
</div>
{% endblock %}
